name: Validate skill
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r skills/pdf-zh-localization/scripts/requirements.txt PyYAML
      - name: Validate skill package
        run: python scripts/validate_skill.py
      - name: Verify command-line entry point
        run: python skills/pdf-zh-localization/scripts/pdf_localize.py --help
